version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data/db:/app/data
      - ./data/chroma:/app/chroma_data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/yuno_platform.db
      - CHROMA_PERSIST_DIR=./chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  chroma_data:
